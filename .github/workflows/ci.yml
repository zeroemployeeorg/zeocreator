name: Smoke

# The full gate (make verify) runs locally before a pull request and, once it exists,
# on ENG-UK in pomar. This job is only the public-repo smoke check: no secrets, under 3 minutes.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Format
        run: make format-check

      - name: Lint
        run: make lint

      - name: Build
        run: uv build
